<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genial Collection | Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <!-- Left Hero Section -->
    <div class="login-hero">
      <div class="brand-badge">GENIAL COLLECTION</div>
      <h1>Luxury Fashion & Signature Fragrance</h1>
      <p>Enter your credentials to access your personalized shopping experience and custom tailoring portal.</p>
    </div>

    <!-- Right Form Section -->
    <div class="login-card">
      <div class="card-header">
        <h2>Login Here</h2>
      </div>

      <form action="GENIAL COLLECTION.html" method="GET" class="login-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter Email Here" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter Password Here" required>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p class="signup-text">
          Don't have an account? <a href="#">Sign up here</a>
        </p>
      </form>
    </div>
  </div>

</body>
</html>
